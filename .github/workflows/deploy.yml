name: Deploy RAG to AWS

on:
  push:
    branches:
      - dev
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest test_lambda.py -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply (ECR only)
        run: terraform apply -auto-approve -target=aws_ecr_repository.rag_repo -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}"

      - name: Get AWS account ID
        id: aws-account
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.aws-account.outputs.account_id }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Build and push Docker image
        run: |
          docker build -t southwest-rag .
          docker tag southwest-rag:latest ${{ steps.aws-account.outputs.account_id }}.dkr.ecr.us-east-1.amazonaws.com/southwest-rag:latest
          docker push ${{ steps.aws-account.outputs.account_id }}.dkr.ecr.us-east-1.amazonaws.com/southwest-rag:latest

      - name: Terraform Apply (full)
        run: terraform apply -auto-approve -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}"

      - name: Update Lambda with latest image
        run: |
          aws lambda update-function-code --function-name southwest-rag --image-uri ${{ steps.aws-account.outputs.account_id }}.dkr.ecr.us-east-1.amazonaws.com/southwest-rag:latest